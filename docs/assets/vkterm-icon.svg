<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- vkTERM app icon: ventana tipo VS Code con explorador, editor, panel y barra lateral -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2b3f"/>
      <stop offset="1" stop-color="#15151f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- marco de la ventana -->
  <rect x="176" y="208" width="672" height="608" rx="44" fill="#1e1e2e" stroke="#45475a" stroke-width="10"/>
  <!-- barra de título -->
  <circle cx="236" cy="258" r="14" fill="#f38ba8"/>
  <circle cx="284" cy="258" r="14" fill="#f9e2af"/>
  <circle cx="332" cy="258" r="14" fill="#a6e3a1"/>
  <!-- explorador -->
  <rect x="196" y="306" width="168" height="490" rx="14" fill="#181825"/>
  <rect x="224" y="344" width="96" height="18" rx="9" fill="#6c7086"/>
  <rect x="244" y="384" width="88" height="18" rx="9" fill="#45475a"/>
  <rect x="244" y="424" width="72" height="18" rx="9" fill="#45475a"/>
  <rect x="224" y="464" width="104" height="18" rx="9" fill="#45475a"/>
  <!-- barra lateral derecha (agentes) -->
  <rect x="672" y="306" width="156" height="235" rx="14" fill="#181825"/>
  <rect x="672" y="561" width="156" height="235" rx="14" fill="#181825"/>
  <rect x="700" y="340" width="72" height="18" rx="9" fill="#6c7086"/>
  <rect x="700" y="595" width="72" height="18" rx="9" fill="#6c7086"/>
  <!-- panel inferior (shell) -->
  <rect x="384" y="672" width="268" height="124" rx="14" fill="#181825"/>
  <rect x="412" y="706" width="20" height="18" rx="4" fill="#a6e3a1"/>
  <rect x="444" y="706" width="110" height="18" rx="9" fill="#45475a"/>
  <!-- editor: prompt grande -->
  <text x="516" y="560" text-anchor="middle" font-family="Menlo, SFMono-Regular, Consolas, monospace" font-weight="700" font-size="190" fill="url(#accent)">&gt;_</text>
</svg>
