# vkTERM: archivos .env, que Micro no resalta. Como en VS Code (lenguaje «Dotenv»):
# los comentarios (# …, también los de una variable comentada) en el color de
# comentario del tema, la clave como variable y el valor como cadena.
filetype: env

detect:
    filename: "(^|/)\\.env($|\\.)|\\.env$|\\.env\\.[A-Za-z0-9_.-]+$"

rules:
    - comment:
        start: "^[[:space:]]*#"
        end: "$"
        rules:
            - todo: "(TODO|FIXME|XXX):?"
    - statement: "^[[:space:]]*export\\b"
    - identifier.var: "^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_.]*[[:space:]]*(=|:)"
    - symbol.operator: "[=:]"
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."
            - identifier.macro: "\\$\\{?[A-Za-z_][A-Za-z0-9_]*\\}?"
    - constant.string:
        start: "'"
        end: "'"
        rules: []
    - identifier.macro: "\\$\\{?[A-Za-z_][A-Za-z0-9_]*\\}?"
    - comment: "[[:space:]]#.*$"
